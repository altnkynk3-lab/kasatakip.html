<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasa Takip</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #0f172a; color: #e5e7eb; font-family: Arial, sans-serif; }
.container { max-width: 1400px; margin: auto; padding: 20px; }
h1 { text-align: center; color: #38bdf8; margin-bottom: 20px; }
.panel { background: #1e293b; padding: 20px; border-radius: 14px; margin-bottom: 20px; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
label { display: block; color: #94a3b8; font-size: 13px; margin-bottom: 6px; }
input, button { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 14px; }
input:focus { outline: none; border-color: #38bdf8; }
button { margin-top: 19px; border: none; background: #0284c7; cursor: pointer; font-weight: bold; }
button:hover { background: #0369a1; }
.reset { background: #dc2626; }
.reset:hover { background: #b91c1c; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 15px; margin-bottom: 20px; }
.card { background: #1e293b; padding: 18px; border-radius: 12px; border-left: 4px solid #38bdf8; }
.card-title { color: #94a3b8; font-size: 13px; }
.card-value { font-size: 23px; font-weight: bold; margin-top: 7px; }
.green { color: #4ade80; }
.table-wrapper { overflow-x: auto; background: #1e293b; border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 600px; }
th { background: #0284c7; color: white; padding: 13px 10px; text-align: left; position: sticky; top: 0; z-index: 2; }
td { padding: 9px 10px; border-bottom: 1px solid #334155; }
tr:hover { background: #263449; }
.day { color: #38bdf8; font-weight: bold; }
.total, .profit { font-weight: bold; }
.profit { color: #4ade80; }

@media (max-width: 640px) {
    .container { padding: 12px; }
    h1 { font-size: 24px; }
    .panel, .card { padding: 14px; }
    .cards { grid-template-columns: 1fr; gap: 10px; }
    .controls { grid-template-columns: 1fr 1fr; }
    .table-wrapper { background: transparent; overflow: visible; }
    table { min-width: 0; }
    thead { display: none; }
    tbody { display: grid; gap: 10px; }
    tr { display: grid; grid-template-columns: 1fr 1fr; background: #1e293b; border-radius: 12px; padding: 12px; gap: 10px; }
    td { display: flex; flex-direction: column; gap: 4px; padding: 0; border: 0; }
    td::before { content: attr(data-label); color: #94a3b8; font-size: 12px; font-weight: normal; }
    td:first-child { grid-column: 1 / -1; }
    input, button { min-height: 44px; }
}
</style>
</head>
<body>
<div class="container">
    <h1>💰 Kasa Takip Programı</h1>

    <div class="panel">
        <div class="controls">
            <div><button onclick="baslat()">KASAYI BAŞLAT</button></div>
            <div><button class="reset" onclick="sifirla()">SIFIRLA</button></div>
        </div>
    </div>

    <div class="cards">
        <div class="card">
            <div class="card-title">Kasa Başlangıcı</div>
            <div class="card-value" id="baslangic">0,00 TL</div>
        </div>
        <div class="card">
            <div class="card-title">Hedef</div>
            <div class="card-value green" id="mevcutKasa">2.291.425,17 TL</div>
        </div>
        <div class="card">
            <div class="card-title">Kasanın Mevcut Durumu</div>
            <div class="card-value green" id="kasaninMevcutDurumu">0,00 TL</div>
        </div>
    </div>

    <div class="panel">
        <label>🔎 Gün / Not Ara</label>
        <input id="arama" type="text" placeholder="Örn: 50 veya maaş" oninput="tabloyuGoster()">
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Gün</th>
                    <th>Toplam Tutar</th>
                    <th>Günlük Getiri</th>
                    <th>Eklenen Para</th>
                    <th>Not</th>
                </tr>
            </thead>
            <tbody id="tablo"></tbody>
        </table>
    </div>
</div>

<script>
const ANA_PARA = 10000;
const GUNLUK_ORAN = 0.015;
const GUN_SAYISI = 365;
var KAYIT_ADI = "kasa_takip_v5";
var kayitliKasa = null;

// Bazı telefonlarda dosya olarak açılan sayfalarda localStorage engellenebilir.
// Bu durumda uygulama yine çalışır; yalnızca kayıtlar kapatılınca saklanmaz.
try {
    kayitliKasa = JSON.parse(localStorage.getItem(KAYIT_ADI));
} catch (hata) {
    kayitliKasa = null;
}

var kasa = kayitliKasa || {
    basladi: false,
    baslangic: 0,
    baslangicGunu: 1,
    ekler: {},
    notlar: {}
};

// Eski kayıtlarda bu alanlar yoksa da uygulama çalışmaya devam eder.
if (!kasa.ekler) kasa.ekler = {};
if (!kasa.notlar) kasa.notlar = {};

function tl(sayi) {
    return new Intl.NumberFormat("tr-TR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
    }).format(sayi) + " TL";
}

function tabloVerisiOlustur() {
    let para = ANA_PARA;
    const sonuc = [];

    for (let gun = 1; gun <= GUN_SAYISI; gun++) {
        const getiri = para * GUNLUK_ORAN;
        para += getiri;
        sonuc.push({ gun, toplam: para, getiri });
    }

    return sonuc;
}

const SABIT_TABLO = tabloVerisiOlustur();

function kaydet() {
    try {
        localStorage.setItem(KAYIT_ADI, JSON.stringify(kasa));
    } catch (hata) {
        // Kayıt alanı kapalıysa hesaplama ekranı çalışmaya devam eder.
    }
}

function baslat() {
    kasa.basladi = true;
    kasa.baslangic = ANA_PARA;
    kasa.baslangicGunu = 1;
    kaydet();
    tabloyuGoster();
}

function ekParaKaydet(gun, deger) {
    if (deger === "") {
        delete kasa.ekler[gun];
    } else {
        const miktar = parseFloat(String(deger).replace(",", "."));
        if (isNaN(miktar)) delete kasa.ekler[gun];
        else kasa.ekler[gun] = miktar;
    }

    kaydet();
    tabloyuGoster();
}

function toplamEklenenPara() {
    let toplam = 0;

    for (const gun in kasa.ekler) {
        toplam += Number(kasa.ekler[gun]) || 0;
    }

    return toplam;
}

function notKaydet(gun, not) {
    kasa.notlar[gun] = not;
    kaydet();
}

function htmlGuvenli(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function tabloyuGoster() {
    const tablo = document.getElementById("tablo");
    const arama = document.getElementById("arama").value.trim().toLowerCase();
    tablo.innerHTML = "";

    for (const satir of SABIT_TABLO) {
        const gun = satir.gun;
        const ek = Number(kasa.ekler[gun]) || 0;
        const not = kasa.notlar[gun] || "";
        if ((gun + " " + not).toLowerCase().indexOf(arama) === -1) continue;

        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td class="day" data-label="Gün">${gun}. Gün</td>
            <td class="total" data-label="Toplam Tutar">${tl(satir.toplam)}</td>
            <td class="profit" data-label="Günlük Getiri">+${tl(satir.getiri)}</td>
            <td data-label="Eklenen Para">
                ${kasa.basladi && gun >= kasa.baslangicGunu ? `
                    <input type="number" step="0.01" placeholder="0,00" value="${ek || ""}"
                        onchange="ekParaKaydet(${gun}, this.value)">
                ` : '<span style="color:#64748b">Başlatılmadı</span>'}
            </td>
            <td data-label="Not">
                <input type="text" placeholder="Not yaz..." value="${htmlGuvenli(not)}"
                    onchange="notKaydet(${gun}, this.value)">
            </td>
        `;
        tablo.appendChild(tr);
    }

    document.getElementById("baslangic").textContent =
        kasa.basladi ? tl(kasa.baslangic) : "0,00 TL";

    // Eklenen para, yazıldığı gün fark etmeksizin bu kartta toplanır.
    const mevcutDurum = kasa.basladi
        ? kasa.baslangic + toplamEklenenPara()
        : 0;
    document.getElementById("kasaninMevcutDurumu").textContent = tl(mevcutDurum);
}

function sifirla() {
    if (!confirm("Kasa kaydı silinsin mi?")) return;
    kasa = { basladi: false, baslangic: 0, baslangicGunu: 1, ekler: {}, notlar: {} };
    try {
        localStorage.removeItem(KAYIT_ADI);
    } catch (hata) {
        // Telefon tarayıcısında kayıt alanı kapalı olabilir.
    }
    tabloyuGoster();
}

tabloyuGoster();
</script>
</body>
</html>
